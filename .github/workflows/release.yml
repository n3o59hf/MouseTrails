name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release

      - name: Build release
        run: cargo build --release
        env:
          MOUSETRAILS_GIT_SHA: ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseTrails-${{ github.sha }}
          path: target/release/MouseTrails.exe
          if-no-files-found: error

      - name: Generate checksum
        run: |
          $hash = (Get-FileHash target/release/MouseTrails.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MouseTrails.exe" | Out-File -Encoding ascii target/release/MouseTrails.exe.sha256
          Get-Content target/release/MouseTrails.exe.sha256

      - name: Move "latest" tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push --force origin latest

      - name: Update rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automated build of `main` @ ${{ github.sha }}.

            Download **MouseTrails.exe** — a single self-contained file
            (static CRT, icon embedded). No installer needed: copy it
            anywhere and run it. Settings live in `%APPDATA%\MouseTrails`.

            The app checks for updates from the tray menu (right-click the
            rainbow icon) or in Settings — Updates.
          files: |
            target/release/MouseTrails.exe
            target/release/MouseTrails.exe.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
